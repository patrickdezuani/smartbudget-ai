spring.application.name=smartbudget-ai

# Porta HTTP da API
server.port=8080

# Actuator: expõe apenas health para verificação inicial
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Perfil padrão. Banco de dados e Spring AI serão configurados nas próximas etapas.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
